description: Ask a person and return the response to the originating work
type: graph
labels: [human-request]
params:
  # One JSON object: title, requester, doing, needs, if_silent, and optionally
  # blocked, options [{choice, effect}], recommendation and links [{label, url}].
  - REQUEST: ""
  - RECIPIENT: team
  - ORIGIN_TYPE: none
  - ORIGIN_REF: ""
  - BLOCKING: "false"
working_dir: ${FYSO_ROOT}
steps:
  # Validates the request and prints the card the person reads. A push-back
  # runs it again with the person's question for the originating conversation.
  - id: prepare
    env:
      - REQUEST_JSON: ${params.REQUEST}
      - REQUEST_RECIPIENT: ${params.RECIPIENT}
      - REQUEST_ORIGIN_TYPE: ${params.ORIGIN_TYPE}
      - REQUEST_ORIGIN_REF: ${params.ORIGIN_REF}
      - REQUEST_BLOCKING: ${params.BLOCKING}
    command: node extensions/human-requests/prepare.cjs
    output: HR_CARD
  - id: ask
    depends: [prepare]
    action: human.task
    with:
      prompt: "${HR_CARD}"
      form:
        type: object
        properties:
          answer: {type: string, title: Answer, default: ""}
          comment: {type: string, title: Comment, default: ""}
          responder: {type: string, title: Responder, default: ""}
          decision: {type: string, title: Decision, enum: [answered, cancelled, expired], default: answered}
        required: [decision]
      push_back:
        rewind_to: prepare
        form:
          type: object
          properties:
            HR_QUESTION: {type: string, title: Question, minLength: 1, maxLength: 2000}
            HR_ASKER: {type: string, title: Asker, default: "", maxLength: 80}
          required: [HR_QUESTION]
  # Run outputs preserve submitted values for operators even if delivery fails.
  - id: record
    depends: [ask]
    action: outputs.write
    with:
      values:
        answer: ${steps.ask.outputs.answer}
        comment: ${steps.ask.outputs.comment}
        responder: ${steps.ask.outputs.responder}
        decision: ${steps.ask.outputs.decision}
  - id: deliver
    depends: [record]
    env:
      # Project operators can set one exact HTTPS destination and the name of
      # its SOPS credential. Empty means HTTP delivery fails closed.
      - FYSO_HR_HTTP_DESTINATION: ''
      - FYSO_HR_HTTP_SECRET_NAME: ''
      # Optional exact IP for a trusted local/private HTTPS receiver.
      - FYSO_HR_HTTP_PRIVATE_ADDRESS: ''
      - REQUEST_ANSWER: ${steps.ask.outputs.answer}
      - REQUEST_COMMENT: ${steps.ask.outputs.comment}
      - REQUEST_RESPONDER: ${steps.ask.outputs.responder}
      - REQUEST_DECISION: ${steps.ask.outputs.decision}
      - REQUEST_ORIGIN_TYPE: ${params.ORIGIN_TYPE}
      - REQUEST_ORIGIN_REF: ${params.ORIGIN_REF}
      - REQUEST_JSON: ${params.REQUEST}
    command: node extensions/human-requests/deliver.cjs
